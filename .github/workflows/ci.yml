name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Master runs finish so their Rust cache save is not lost.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-guide:
    name: Code Guide
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # The reader serves an explicitly pinned historical snapshot.
      - name: Verify the local guide and pinned source catalog
        working-directory: docs/guide
        env:
          VOCO_SOURCE: ../..
        run: python3 -m unittest discover -s tests -v

  rust-security:
    name: RustSec Audit
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: 1.94.0

      - name: Rust dependency security audit
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --version "0.22.2" --locked
          cargo audit

  check:
    name: Frontend Checks
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libpulse-dev \
            desktop-file-utils appstream \
            ibus ibus-gtk3 python3 python3-numpy python3-psutil python3-gi gir1.2-ibus-1.0 bubblewrap \
            xvfb xdotool xclip gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-atspi-2.0 at-spi2-core \
            weston libweston-13-0 wayland-utils gir1.2-gtk-4.0 gir1.2-webkit-6.0 \
            gnome-text-editor gnome-terminal nano gnome-shell gnome-shell-extension-appindicator xwayland

      - name: Install Node dependencies
        run: npm ci

      - name: DevOps preflight
        run: npm run verify:devops

      - name: Dependency security audit
        run: npm run verify:security

      - name: TypeScript check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Install renderer test browser
        run: npx playwright install --with-deps chromium

      - name: Branded interface and panel state regression
        run: npm run test:brand-motion && node --test scripts/test-panel-model.mjs
        env:
          VOCO_RENDERER_EVIDENCE_DIR: ${{ runner.temp }}/voco-brand-motion

      - name: GNOME companion shortcut and lifecycle regression
        timeout-minutes: 3
        env:
          VOCO_NATIVE_DEPS: /usr
          VOCO_PANEL_EVIDENCE_DIR: ${{ runner.temp }}/voco-panel
        run: bash scripts/test-private-ibus-engine-hosted.sh --gnome-panel

      - name: Dictation renderer lifecycle regression
        run: npm run test:dictation-renderer
        env:
          VOCO_RENDERER_EVIDENCE_DIR: ${{ runner.temp }}/voco-dictation-renderer

      - name: Microphone refresh and retry regression
        run: npm run test:microphone-renderer
        env:
          VOCO_RENDERER_EVIDENCE_DIR: ${{ runner.temp }}/voco-microphone-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Native capture setup and recovery regression
        timeout-minutes: 5
        run: npm run test:native-capture-renderer
        env:
          VOCO_RENDERER_EVIDENCE_DIR: ${{ runner.temp }}/voco-native-capture-renderer

      - name: Chromium exact-field adversarial regression
        run: npm run test:chromium-exact-field

      - name: Onboarding speech test and desktop setup regression
        timeout-minutes: 5
        run: npm run test:native-capture-renderer
        env:
          VOCO_RENDERER_SUITE: onboarding
          VOCO_RENDERER_EVIDENCE_DIR: ${{ runner.temp }}/voco-onboarding-renderer

      - name: Browser delivery
        timeout-minutes: 3
        env:
          VOCO_DELIVERY_EVIDENCE_DIR: ${{ runner.temp }}/voco-browser-delivery
        run: bash scripts/test-private-ibus-engine-hosted.sh --browser-delivery

      - name: Application delivery
        timeout-minutes: 3
        env:
          VOCO_DELIVERY_EVIDENCE_DIR: ${{ runner.temp }}/voco-application-delivery
        run: bash scripts/test-private-ibus-engine-hosted.sh --application-delivery

      - name: Private headless IBus lifecycle
        run: bash scripts/test-private-ibus-engine-hosted.sh

      - name: Native GTK delivery and WebKit coverage checks
        timeout-minutes: 5
        env:
          VOCO_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/voco-native-desktop
        run: bash scripts/test-private-ibus-engine-hosted.sh --native-desktop

      - name: Private native Wayland toolkit compatibility
        timeout-minutes: 3
        env:
          VOCO_WAYLAND_DEPS: /usr
          VOCO_WAYLAND_EVIDENCE_DIR: ${{ runner.temp }}/voco-native-wayland
        run: bash scripts/test-private-ibus-engine-hosted.sh --native-wayland

      - name: Retain native desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-desktop-evidence
          path: |
            ${{ runner.temp }}/voco-browser-delivery/
            ${{ runner.temp }}/voco-application-delivery/
            ${{ runner.temp }}/voco-native-desktop/
            ${{ runner.temp }}/voco-native-wayland/
            ${{ runner.temp }}/voco-dictation-renderer/
            ${{ runner.temp }}/voco-microphone-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/voco-native-capture-renderer/
            ${{ runner.temp }}/voco-onboarding-renderer/
            ${{ runner.temp }}/voco-brand-motion/
            ${{ runner.temp }}/voco-panel/
          if-no-files-found: ignore
          retention-days: 7

      - name: Frontend production build
        run: npm --workspace @voco/desktop run build:frontend

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/tauri/VOCO.desktop

      - name: Validate AppStream metadata
        run: |
          appstreamcli validate packaging/tauri/com.sergiopesch.voco.metainfo.xml

  rust:
    name: Rust Check & Test
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libpulse-dev python3-numpy python3-psutil libsentencepiece0 \
            pulseaudio pulseaudio-utils bubblewrap binutils

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Install Node dependencies
        run: npm ci

      - name: Build production frontend for Tauri checks
        run: npm --workspace @voco/desktop run build:frontend

      # Clippy fetches the locked crates that the offline glib checks read.
      - name: Cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Verify glib source backport and optimized iterator regression
        run: |
          python3 scripts/verify-glib-backport.py
          python3 scripts/test-glib-variant.py --output "${{ runner.temp }}/voco-glib-regression"

      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --all-targets

      - name: Native capture C callback lifecycle (no audio server)
        run: npm run test:native-capture-callbacks

      - name: Native capture source latency and complete audio
        timeout-minutes: 3
        env:
          VOCO_NATIVE_PULSE_EVIDENCE_DIR: ${{ runner.temp }}/voco-native-pulse-latency
        run: bash scripts/test-private-ibus-engine-hosted.sh --native-pulse-latency

      - name: Provision checksum-pinned Nemotron runtime
        run: bash scripts/provision-ci-speech.sh

      - name: Nemotron speech regression baseline
        run: |
          npm run test:speech-baseline -- --report "${{ runner.temp }}/voco-speech-baseline.json"
          /usr/bin/python3 runtime/speech/test_worker_protocol.py --output-dir "${{ runner.temp }}/voco-worker-protocol"

      - name: Retain speech regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speech-regression-evidence
          path: |
            ${{ runner.temp }}/voco-glib-regression/result.json
            ${{ runner.temp }}/voco-native-pulse-latency/
            ${{ runner.temp }}/voco-worker-protocol/*.json
            ${{ runner.temp }}/voco-speech-*.json
          if-no-files-found: ignore
          retention-days: 7

  # Hosted CI never assembles or signs the NVIDIA package; scripts/assemble-release.sh
  # does that locally. This job runs the release build end to end in private sessions.
  application:
    name: Application
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libpulse-dev \
            ibus ibus-gtk3 python3 python3-numpy python3-psutil python3-gi gir1.2-ibus-1.0 bubblewrap \
            xvfb xdotool xclip gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-atspi-2.0 at-spi2-core \
            weston libweston-13-0 wayland-utils gir1.2-gtk-4.0 gir1.2-webkit-6.0 \
            gnome-shell gnome-shell-extension-appindicator xwayland \
            gnome-text-editor gnome-terminal nano acl \
            libsentencepiece0 pulseaudio pulseaudio-utils

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        run: npm --workspace @voco/desktop run build:frontend

      - name: Provision checksum-pinned Nemotron runtime
        run: bash scripts/provision-ci-speech.sh

      - name: Build release application
        working-directory: apps/desktop/src-tauri
        run: |
          cargo build --locked --release --features custom-protocol --bin voco --bin voco-browser-host
          # The packaged extension files, staged outside the harnesses' private /tmp.
          extension="${RUNNER_TEMP}/voco-chromium-extension"
          mkdir -p "${extension}"
          cp ../../../integrations/chromium/manifest.json ../../../integrations/chromium/background.js \
            ../../../integrations/chromium/content.js "${extension}/"
          {
            echo "VOCO_NATIVE_APP_BINARY=${PWD}/target/release/voco"
            echo "VOCO_BROWSER_HOST_BINARY=${PWD}/target/release/voco-browser-host"
            echo "VOCO_BROWSER_EXTENSION_DIR=${extension}"
          } >> "${GITHUB_ENV}"

      - name: Application tray bridge on GNOME
        timeout-minutes: 5
        env:
          VOCO_NATIVE_DEPS: /usr
          VOCO_PANEL_EVIDENCE_DIR: ${{ runner.temp }}/voco-application-panel
          # Frontend Checks runs the synthetic companion cases on this Shell.
          VOCO_PANEL_SUITE: bridge
        run: VOCO_PANEL_APP_BINARY="${VOCO_NATIVE_APP_BINARY}" bash scripts/test-private-ibus-engine-hosted.sh --gnome-panel

      - name: Application capture and paste into the focused field
        timeout-minutes: 5
        env:
          VOCO_NATIVE_BUILD_ROLE: ci-release-build
          VOCO_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/voco-application-native
        run: bash scripts/test-private-ibus-engine-hosted.sh --full-application

      # The virtual keyboard delivery steps paste through insertion.rs's ignored
      # fixture test, built from the same release dependencies.
      - name: Build the production paste test
        working-directory: apps/desktop/src-tauri
        run: |
          binary=$(cargo test --locked --release --features custom-protocol --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable')
          [[ -x "${binary}" ]]
          echo "VOCO_FIXTURE_PASTE_BINARY=${binary}" >> "${GITHUB_ENV}"

      # Only the next two steps give their namespace /dev/uinput, and the bridge
      # outside reads and grabs each VOCO keyboard. Both grants are for the runner
      # alone; nothing becomes world-writable.
      - name: Grant the runner VOCO's virtual keyboards
        run: |
          sudo modprobe uinput
          sudo setfacl -m "u:${USER}:rw" /dev/uinput
          printf 'SUBSYSTEM=="input", KERNEL=="event*", ATTRS{name}=="VOCO virtual keyboard", RUN+="/usr/bin/setfacl -m u:%s:r $devnode"\n' "${USER}" \
            | sudo tee /etc/udev/rules.d/99-voco-uinput-bridge.rules
          sudo udevadm control --reload-rules

      - name: Application delivery through the virtual keyboard on GNOME Wayland
        timeout-minutes: 5
        env:
          VOCO_DELIVERY_PLATFORM: gnome-wayland
          VOCO_UINPUT_BRIDGE: "1"
          VOCO_DELIVERY_EVIDENCE_DIR: ${{ runner.temp }}/voco-application-delivery-gnome-wayland
        run: bash scripts/test-private-ibus-engine-hosted.sh --application-delivery

      - name: Browser delivery through the virtual keyboard on GNOME Wayland
        timeout-minutes: 5
        env:
          VOCO_DELIVERY_PLATFORM: gnome-wayland
          VOCO_UINPUT_BRIDGE: "1"
          VOCO_DELIVERY_EVIDENCE_DIR: ${{ runner.temp }}/voco-browser-delivery-gnome-wayland
        run: bash scripts/test-private-ibus-engine-hosted.sh --browser-delivery

      - name: Application Wayland lifecycle and model cache readiness
        timeout-minutes: 3
        env:
          VOCO_WAYLAND_DEPS: /usr
          VOCO_WAYLAND_EVIDENCE_DIR: ${{ runner.temp }}/voco-application-wayland
        run: VOCO_WAYLAND_APP_BINARY="${VOCO_NATIVE_APP_BINARY}" bash scripts/test-private-ibus-engine-hosted.sh --native-wayland

      - name: Application capture into an exact Chromium field
        timeout-minutes: 8
        env:
          VOCO_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/voco-application-browser
        run: bash scripts/test-private-ibus-engine-hosted.sh --browser-application

      - name: Application Chromium toolbar action
        timeout-minutes: 5
        env:
          VOCO_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/voco-application-toolbar
        run: bash scripts/test-private-ibus-engine-hosted.sh --browser-toolbar

      - name: Retain application evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-evidence
          path: |
            ${{ runner.temp }}/voco-application-panel/
            ${{ runner.temp }}/voco-application-native/
            ${{ runner.temp }}/voco-application-delivery-gnome-wayland/
            ${{ runner.temp }}/voco-browser-delivery-gnome-wayland/
            ${{ runner.temp }}/voco-application-wayland/
            ${{ runner.temp }}/voco-application-browser/
            ${{ runner.temp }}/voco-application-toolbar/
          if-no-files-found: ignore
          retention-days: 7

  gnome-50:
    name: GNOME 50 Companion
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap dbus-bin dbus-daemon libglib2.0-bin python3 python3-gi gir1.2-gtk-3.0 \
            gnome-shell gnome-shell-ubuntu-extensions

      # GNOME 50 has no nested mode; the harness runs Shell headless and sends
      # keys and clicks through a private RemoteDesktop session.
      - name: GNOME 50 companion shortcut and lifecycle regression
        timeout-minutes: 3
        env:
          VOCO_NATIVE_DEPS: /usr
          VOCO_PANEL_EVIDENCE_DIR: ${{ runner.temp }}/voco-panel-gnome50
        run: bash scripts/test-private-ibus-engine-hosted.sh --gnome-panel

      - name: Retain GNOME 50 companion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome50-panel-evidence
          path: ${{ runner.temp }}/voco-panel-gnome50/
          if-no-files-found: ignore
          retention-days: 7

  distro-runtime:
    name: ${{ matrix.name }} Runtime
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
            tools: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl python3 nodejs dpkg
          - name: Fedora 44
            image: registry.fedoraproject.org/fedora:44@sha256:7011f51bd8089d345be42d41f0aa3190d258823528852a5e7ec976fe2fd20f53
            tools: dnf install -y git curl python3 nodejs dpkg
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install checkout and provisioning tools
        run: ${{ matrix.tools }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # The package's dependencies by this distribution's names: a renamed or
      # missing package fails here, before a release does.
      - name: Install VOCO's package dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if command -v apt-get >/dev/null; then
            apt-get install -y --no-install-recommends $(python3 scripts/distro-dependencies.py debian)
          else
            dnf install -y $(python3 scripts/distro-dependencies.py fedora)
          fi

      - name: Provision checksum-pinned Nemotron runtime
        run: bash scripts/provision-ci-speech.sh

      - name: Speech runtime, IBus and worker protocol on this distribution's Python
        run: |
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -m unittest discover -s runtime/speech -p "test_*.py"
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 apps/desktop/src-tauri/resources/voco_ibus_protocol_test.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 apps/desktop/src-tauri/resources/voco_ibus_engine_test.py
          /usr/bin/python3 runtime/speech/test_worker_protocol.py --output-dir "$RUNNER_TEMP/voco-worker-protocol"

      - name: Nemotron accuracy and continuity baseline
        run: node scripts/test-speech-baseline.mjs --report "$RUNNER_TEMP/voco-speech-baseline.json"
