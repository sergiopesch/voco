name: CI

# Trial branch only, never merged: builds VOCO's real snap through
# package-nvidia.py --snap on Ubuntu 24.04, installs it and measures it under
# strict confinement. It uploads no snap, package or artifact.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  snap-trial:
    name: Snap Trial
    timeout-minutes: 150
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the build, the snap and its copies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install build and check dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libpulse-dev python3 python3-numpy python3-yaml libsentencepiece0 \
            desktop-file-utils appstream squashfs-tools binutils xvfb

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          save-if: false

      - name: Install the pinned Tauri CLI
        timeout-minutes: 20
        run: cargo install tauri-cli --version 2.12.1 --locked

      - name: Install Node dependencies
        run: npm ci

      - name: Provision checksum-pinned Nemotron runtime
        run: bash scripts/provision-ci-speech.sh

      - name: Build the base package
        timeout-minutes: 40
        run: npm run build

      - name: Install Snapcraft
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3 4 5; do
            sudo snap install snapcraft --classic --channel=9.x/stable && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 20
          done
          snapcraft --version

      - name: Build the Debian package and the snap from one staged tree
        timeout-minutes: 40
        run: |
          set -o pipefail
          version="$(node -p "require('./package.json').version")"
          base="$(ls apps/desktop/src-tauri/target/release/bundle/deb/*_"${version}"_amd64.deb)"
          out="${RUNNER_TEMP}/out"
          mkdir -p "${out}"
          echo "VOCO_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "VOCO_OUT=${out}" >> "${GITHUB_ENV}"
          # Root builds a destructive-mode snap; the glib check still needs this runner's Rust.
          sudo env VOCO_SNAP_BUILD=destructive PATH="${PATH}" RUSTUP_HOME="${HOME}/.rustup" \
            CARGO_HOME="${HOME}/.cargo" python3 scripts/package-nvidia.py \
            "${base}" "${out}/voco_${version}_amd64.deb" --snap "${out}/voco_${version}_amd64.snap" \
            2>&1 | tee "${out}/build.log"
          sudo chown -R "$(id -u):$(id -g)" "${out}"
          ls -l "${out}"
          df -h /

      - name: Snapcraft's lint report
        if: always()
        run: grep -iE -A40 'lint warnings|lint:' "${VOCO_OUT}/build.log" || echo "No lint section in the build log"

      - name: Verify the Debian package and the snap
        timeout-minutes: 10
        run: |
          bash scripts/verify-deb-package.sh "${VOCO_OUT}/voco_${VOCO_VERSION}_amd64.deb" "${VOCO_VERSION}"
          snap list core24 >/dev/null 2>&1 || sudo snap install core24
          bash scripts/verify-snap-package.sh "${VOCO_OUT}/voco_${VOCO_VERSION}_amd64.snap" "${VOCO_VERSION}" \
            "${VOCO_OUT}/voco_${VOCO_VERSION}_amd64.deb"

      - name: What the snap carries
        if: always()
        run: |
          root="${RUNNER_TEMP}/snap-root"
          rm -rf "${root}"
          unsquashfs -no-progress -quiet -dest "${root}" "${VOCO_OUT}/voco_${VOCO_VERSION}_amd64.snap" >/dev/null
          cat "${root}/meta/snap.yaml"
          cat "${root}/meta/gui/voco.desktop"
          du -sh "${root}" "${root}/usr/lib/voco/speech" "${root}/usr/lib/voco/snap/python" "${root}/usr/lib/voco/snap/helpers"
          find "${root}" -maxdepth 3 -not -path '*/usr/lib/voco/snap/*' -not -path '*/usr/share/doc/*' | sort | head -120
          ls "${root}/snap"
          head -c 6000 "${root}/snap/manifest.yaml" || true
          ls -l "${VOCO_OUT}"

      - name: Install the snap
        timeout-minutes: 15
        run: |
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "${GITHUB_ENV}"
          sudo snap install --dangerous "${VOCO_OUT}/voco_${VOCO_VERSION}_amd64.snap"
          snap connections voco
          sudo snap connect voco:audio-record
          sudo snap connect voco:login-session-observe
          snap connections voco
          snap run voco --version

      - name: Inside the confinement
        timeout-minutes: 10
        run: |
          common="${HOME}/snap/voco/common"
          mkdir -p "${common}/fixtures"
          cp trial/snap/inside.sh trial/snap/worker_check.py "${common}/"
          cp tests/fixtures/speech/manifest.json tests/fixtures/speech/*.wav "${common}/fixtures/"
          echo "--- snap run --shell, as it starts"
          snap run --shell voco -c 'echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"'
          echo "--- through the app's command chain"
          snap run --shell voco -c '"$SNAP/snap/command-chain/gpu-2404-wrapper" "$SNAP/snap/command-chain/desktop-launch" bash "$SNAP_USER_COMMON/inside.sh"'

      - name: Recognition and cold warm-up, package against snap
        timeout-minutes: 30
        run: |
          drop() { sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null; }
          deb="${RUNNER_TEMP}/deb-root"
          dpkg-deb -x "${VOCO_OUT}/voco_${VOCO_VERSION}_amd64.deb" "${deb}"
          for round in 1 2; do
            drop
            python3 trial/snap/worker_check.py /usr/bin/python3 "${deb}/usr/lib/voco/speech/stream_worker.py" \
              tests/fixtures/speech > "${RUNNER_TEMP}/deb-${round}.json"
            drop
            snap run --shell voco -c '"$VOCO_STREAM_PYTHON" -E -s -B "$SNAP_USER_COMMON/worker_check.py" "$VOCO_STREAM_PYTHON" "$VOCO_STREAM_WORKER" "$SNAP_USER_COMMON/fixtures"' \
              > "${RUNNER_TEMP}/snap-lzo-${round}.json"
          done
          python3 - "${RUNNER_TEMP}" <<'PY'
          import json, sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          reports = {path.stem: json.loads(path.read_text()) for path in sorted(folder.glob("*-[12].json"))}
          for name, report in reports.items():
              print(f"{name}: ready {report['readySeconds']} s, aggregate WER {report['aggregateWer']}")
          texts = {name: [fixture["text"] for fixture in report["fixtures"]] for name, report in reports.items()}
          same = len({json.dumps(value) for value in texts.values()}) == 1
          print("identical text in every run:", same)
          for fixture in reports["deb-1"]["fixtures"]:
              print(f"  {fixture['id']}: WER {fixture['wer']} - {fixture['text']}")
          if not same:
              raise SystemExit("The confined worker wrote different text from the package's worker")
          PY

      - name: The app warms its worker under confinement
        timeout-minutes: 10
        run: |
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          ls -l "${XDG_RUNTIME_DIR}/bus" || true
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          sleep 2
          start=$(date +%s.%N)
          DISPLAY=:99 RUST_LOG=info timeout 150 snap run voco > "${RUNNER_TEMP}/app.log" 2>&1 &
          for _ in $(seq 1 280); do
            grep -q 'Bundled Nemotron streaming model ready' "${RUNNER_TEMP}/app.log" && break
            sleep 0.5
          done
          python3 -c "import sys, time; print(f'model ready after {time.time() - float(sys.argv[1]):.1f} s')" "${start}"
          # The helpers reach the X server from inside the confinement: a
          # clipboard round trip through xclip, and xdotool's paste keys.
          snap run --shell voco -c 'export DISPLAY=:99; printf "voco-trial" | xclip -selection clipboard -in; sleep 1; xclip -selection clipboard -out; echo; xdotool key --clearmodifiers shift+Insert; echo "xdotool exit $?"; notify-send --version'
          sleep 5
          pkill -f 'snap/voco/.*/usr/bin/voco' || true
          sleep 2
          tail -60 "${RUNNER_TEMP}/app.log"
          grep -q 'Bundled Nemotron streaming model ready' "${RUNNER_TEMP}/app.log"

      - name: Install a nested GNOME Shell, PipeWire and the field's toolkit
        timeout-minutes: 15
        run: |
          sudo apt-get install -y --no-install-recommends gnome-shell xwayland pipewire pipewire-bin \
            pipewire-pulse wireplumber pulseaudio-utils python3-gi gir1.2-gtk-3.0 xdotool dbus libglib2.0-bin

      - name: The snap dictates into a GTK field on X11
        timeout-minutes: 10
        run: python3 trial/snap/e2e.py x11 "${RUNNER_TEMP}/e2e-x11"

      - name: The snap dictates into a GTK field on GNOME Wayland through the companion
        timeout-minutes: 15
        run: python3 trial/snap/e2e.py gnome-wayland "${RUNNER_TEMP}/e2e-gnome"

      - name: End-to-end evidence
        if: always()
        run: |
          for platform in x11 gnome; do
            dir="${RUNNER_TEMP}/e2e-${platform}"
            [ -d "${dir}" ] || continue
            echo "=== ${platform}"
            ls -l "${dir}"
            tail -n 60 "${dir}/voco.log" 2>/dev/null || true
            tail -n 40 "${dir}/gnome-shell.log" 2>/dev/null || true
            tail -n 20 "${dir}/field.err" 2>/dev/null || true
            grep -h '"paste_keys"' "${dir}/performance.jsonl" 2>/dev/null | head -5 || true
          done

      - name: AppArmor and seccomp denials
        if: always()
        run: |
          sudo journalctl -k --no-pager | grep -E 'apparmor="DENIED".*snap\.voco|audit.*snap\.voco' \
            | sed -E 's/^.*(apparmor="DENIED".*)$/\1/' | sed -E 's/ pid=[0-9]+//; s/ fsuid=[0-9]+ ouid=[0-9]+//' \
            | sort | uniq -c | sort -rn | head -60 || echo "No denials"
