name: Release

on:
  push:
    tags:
      - "voco.*"

permissions:
  contents: read

env:
  CMAKE_PROJECT_INCLUDE: ${{ github.workspace }}/packaging/cmake/portable-cpu.cmake

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/usr/src/voco --remap-path-prefix=/home/runner=/build/runner"
      CFLAGS: "-ffile-prefix-map=${{ github.workspace }}=/usr/src/voco -ffile-prefix-map=/home/runner=/build/runner"
      CXXFLAGS: "-ffile-prefix-map=${{ github.workspace }}=/usr/src/voco -ffile-prefix-map=/home/runner=/build/runner"
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm

      - name: Validate canonical release tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="voco.${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match ${EXPECTED_TAG}." >&2
            exit 1
          fi
          echo "tag_name=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_name=VOCO ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev clang mold cmake file wget \
            desktop-file-utils appstream ripgrep curl libsentencepiece-dev \
            ibus ibus-gtk3 python3 python3-numpy python3-psutil python3-gi gir1.2-ibus-1.0 bubblewrap \
            xvfb xdotool gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-atspi-2.0 at-spi2-core \
            pulseaudio pulseaudio-utils libpulse-dev gstreamer1.0-plugins-good \
            weston libweston-13-0 wayland-utils gir1.2-gtk-4.0 gir1.2-webkit-6.0

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri

      # The pinned wrapper does not track arbitrary CMake inputs in Cargo's cache.
      - name: Clear cached compatibility-engine objects
        run: cargo clean --manifest-path apps/desktop/src-tauri/Cargo.toml -p whisper-rs-sys

      - name: Install Node dependencies
        run: npm ci

      - name: DevOps preflight
        run: npm run verify:devops

      - name: Validate Linux desktop metadata
        run: |
          desktop-file-validate packaging/flatpak/com.sergiopesch.voco.desktop
          desktop-file-validate packaging/tauri/VOCO.desktop
          appstreamcli validate packaging/flatpak/com.sergiopesch.voco.metainfo.xml
          appstreamcli validate packaging/tauri/com.sergiopesch.voco.metainfo.xml

      - name: Dependency security audit
        run: npm run verify:security

      - name: Rust dependency security audit
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --version "0.22.2" --locked
          cargo audit

      - name: Frontend quality gate
        run: npm run check && npm run lint && npm test && npm --workspace @voco/desktop run build:frontend

      - name: Install renderer test browser
        run: npx playwright install --with-deps chromium

      - name: Dictation renderer lifecycle regression
        run: npm run test:dictation-renderer

      - name: Microphone refresh and retry regression
        run: npm run test:microphone-renderer
        env:
          VOCO_RENDERER_EVIDENCE_DIR: ${{ runner.temp }}/voco-microphone-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Chromium exact-field adversarial regression
        run: npm run test:chromium-exact-field

      - name: Private headless IBus lifecycle
        run: bash scripts/test-private-ibus-engine-hosted.sh

      - name: Native GTK delivery and WebKit coverage checks
        timeout-minutes: 5
        env:
          VOCO_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/voco-native-desktop
        run: bash scripts/test-private-ibus-engine-hosted.sh --native-desktop

      - name: Rust quality gate
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check && cargo test --locked --all-targets && cargo test --locked --lib --features native-capture-dev && cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Existing-model speech regression baseline
        env:
          VOCO_MODEL_PATH: ${{ runner.temp }}/voco-ggml-base.en.bin
        run: |
          curl --fail --location --retry 3 --max-time 180 --output "$VOCO_MODEL_PATH" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          echo "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  $VOCO_MODEL_PATH" | sha256sum --check --strict
          speech_failed=0
          npm run test:speech-baseline -- --report "${{ runner.temp }}/voco-speech-baseline.json" || speech_failed=1
          npm run test:speech-continuity -- --report "${{ runner.temp }}/voco-speech-continuity.json" || speech_failed=1
          npm run test:speech-adversarial -- --output-dir "${{ runner.temp }}/voco-speech-adversarial" || speech_failed=1
          exit "$speech_failed"

      - name: Configure mold linker
        run: |
          mkdir -p apps/desktop/src-tauri/.cargo
          printf '[target.x86_64-unknown-linux-gnu]\nlinker = "clang"\nrustflags = ["-C", "link-arg=-fuse-ld=mold"]\n' > apps/desktop/src-tauri/.cargo/config.toml

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.10.1" --locked

      - name: Build Debian bundle
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: bash scripts/build-desktop.sh

      - name: Build pinned portable speech runtime
        run: |
          python3 scripts/build-nvidia-runtime.py \
            --work-dir "$RUNNER_TEMP/voco-native-build" \
            --output "$RUNNER_TEMP/voco-native-payload"
          cp -a "$RUNNER_TEMP/voco-native-payload/lib" runtime/speech/
          cp "$RUNNER_TEMP/voco-native-payload/"{libbench_nemo_pool.so,voco-cpu-check,BUILD-IDENTITY.json} runtime/speech/
          python3 scripts/provision-nvidia-model.py
          python3 runtime/speech/test_worker_protocol.py --output-dir "$RUNNER_TEMP/voco-worker-protocol"

      - name: Assemble complete local speech payload
        shell: bash
        run: |
          DEB=$(find apps/desktop/src-tauri/target/release/bundle/deb -name "*${{ steps.version.outputs.version }}*amd64.deb" | sort | tail -1)
          test -n "$DEB"
          BASE="${RUNNER_TEMP}/voco-tauri-base.deb"
          mv "$DEB" "$BASE"
          python3 scripts/package-nvidia.py "$BASE" "$DEB"

      - name: Verify Debian bundle
        shell: bash
        run: |
          DEB=$(find apps/desktop/src-tauri/target/release/bundle/deb -name "*${{ steps.version.outputs.version }}*amd64.deb" | sort | tail -1)
          if [ -z "$DEB" ]; then
            echo "Versioned Debian artifact was not produced." >&2
            exit 1
          fi
          bash scripts/verify-deb-package.sh "$DEB" "${{ steps.version.outputs.version }}"
          CANDIDATE_DIR="${RUNNER_TEMP}/voco-native-packaged"
          mkdir -p "$CANDIDATE_DIR"
          dpkg-deb --extract "$DEB" "$CANDIDATE_DIR"
          echo "VOCO_NATIVE_APP_BINARY=${CANDIDATE_DIR}/usr/bin/voco" >> "$GITHUB_ENV"
          echo "VOCO_BROWSER_HOST_BINARY=${CANDIDATE_DIR}/usr/libexec/voco-browser-host" >> "$GITHUB_ENV"
          echo "VOCO_BROWSER_EXTENSION_DIR=${CANDIDATE_DIR}/usr/share/voco/chromium" >> "$GITHUB_ENV"

      - name: Native application capture and manual Copy
        timeout-minutes: 5
        env:
          VOCO_NATIVE_BUILD_ROLE: packaged-candidate
          VOCO_NATIVE_MODEL: ${{ runner.temp }}/voco-ggml-base.en.bin
          VOCO_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/voco-native-application
        run: bash scripts/test-private-ibus-engine-hosted.sh --full-application

      - name: Packaged application Wayland lifecycle and model cache readiness
        timeout-minutes: 3
        env:
          VOCO_WAYLAND_DEPS: /usr
          VOCO_WAYLAND_MODEL: ${{ runner.temp }}/voco-ggml-base.en.bin
          VOCO_WAYLAND_EVIDENCE_DIR: ${{ runner.temp }}/voco-native-wayland
        run: VOCO_WAYLAND_APP_BINARY="$VOCO_NATIVE_APP_BINARY" bash scripts/test-private-ibus-engine-hosted.sh --native-wayland

      - name: Packaged application capture to exact Chromium field
        timeout-minutes: 5
        env:
          VOCO_NATIVE_MODEL: ${{ runner.temp }}/voco-ggml-base.en.bin
          VOCO_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/voco-browser-application
        run: bash scripts/test-private-ibus-engine-hosted.sh --browser-application

      - name: Retain native application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-application-evidence
          path: |
            ${{ runner.temp }}/voco-native-desktop/
            ${{ runner.temp }}/voco-native-application/
            ${{ runner.temp }}/voco-native-wayland/
            ${{ runner.temp }}/voco-browser-application/
            ${{ runner.temp }}/voco-speech-*.json
            ${{ runner.temp }}/voco-speech-adversarial/**/*.json
            ${{ runner.temp }}/voco-speech-adversarial/**/*.log
            ${{ runner.temp }}/voco-speech-adversarial/**/*.stderr
            ${{ runner.temp }}/voco-speech-adversarial/transcribe.rs
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect release artifacts
        shell: bash
        run: |
          DEB=$(find apps/desktop/src-tauri/target/release/bundle/deb -name "*${{ steps.version.outputs.version }}*amd64.deb" | sort | tail -1)
          if [ -z "$DEB" ]; then
            echo "Versioned Debian artifact was not produced." >&2
            exit 1
          fi
          cp "$DEB" "voco_${{ steps.version.outputs.version }}_amd64.deb"
          cp "$DEB" "voco_latest_amd64.deb"

      - name: Render release notes
        shell: bash
        run: |
          bash ./scripts/render-release-body.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.tag_name }}" > release-body.md

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum "voco_${{ steps.version.outputs.version }}_amd64.deb" > voco_checksums.txt
          sha256sum voco_latest_amd64.deb > voco_latest_checksums.txt
          mkdir release-assets
          cp \
            "voco_${{ steps.version.outputs.version }}_amd64.deb" \
            voco_latest_amd64.deb \
            voco_checksums.txt \
            voco_latest_checksums.txt \
            release-body.md \
            release-assets/

      - name: Upload verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voco-release-${{ steps.version.outputs.version }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  create-draft:
    name: Create Draft Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: voco-release-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Create draft GitHub Release with verified assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.build.outputs.release_name }}
          body_path: release-assets/release-body.md
          files: |
            release-assets/voco_${{ needs.build.outputs.version }}_amd64.deb
            release-assets/voco_latest_amd64.deb
            release-assets/voco_checksums.txt
            release-assets/voco_latest_checksums.txt
          draft: true
          prerelease: false
