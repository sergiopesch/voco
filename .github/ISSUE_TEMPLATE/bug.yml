name: Bug report
description: Report a reproducible problem with VOCO.
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Remove personal text, recordings, paths and credentials. For vulnerabilities, use the private Security tab instead."
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: VOCO version, distribution, desktop, X11 or Wayland, and affected app.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Steps to reproduce, expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional sanitized evidence
      description: Include only the relevant error code or timing summary. Inspect attachments before sharing.
