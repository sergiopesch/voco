[package]
name = "voco"
version = "2026.0.52"
description = "Turn speech into text at your cursor with local dictation"
authors = ["VOCO Contributors"]
edition = "2021"
default-run = "voco"

[lib]
name = "voco_lib"
crate-type = ["lib"]

[[bin]]
name = "voco"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "=1.4.6"
pkg-config = "=0.3.32"

[features]
default = ["native-capture"]
custom-protocol = ["tauri/custom-protocol"]
native-capture = []
native-capture-dev = ["native-capture"]

[dependencies]
tauri = { version = "=2.11.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
global-hotkey = "=0.7.0"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
glib = "0.18"
evdev = "0.12"
inotify = "0.11"
libc = "0.2"

[patch.crates-io]
global-hotkey = { path = "../../../vendor/global-hotkey" }
glib = { path = "../../../vendor/glib" }
tray-icon = { path = "../../../vendor/tray-icon" }
