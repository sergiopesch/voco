[package]
name = "voco"
version = "2026.0.71"
description = "The voice layer for Linux, starting with dictation"
authors = ["VOCO Contributors"]
license = "MIT"
repository = "https://github.com/sergiopesch/voco"
edition = "2021"
# The toolchain CI builds with; keep it in step with .github/workflows/ci.yml.
rust-version = "1.99.0"
default-run = "voco"

[lib]
name = "voco_lib"
crate-type = ["lib"]

[[bin]]
name = "voco"
path = "src/main.rs"

# Install update's root helper. The release build makes it on its own and the
# packages place it at /usr/libexec only; the feature keeps Tauri's bundler,
# which copies every other binary into /usr/bin, from shipping a second copy.
[[bin]]
name = "voco-update-helper"
path = "src/bin/voco-update-helper.rs"
required-features = ["update-helper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "=1.11.1"
pkg-config = "=0.3.34"

[features]
default = ["native-capture"]
custom-protocol = ["tauri/custom-protocol"]
native-capture = []
update-helper = []

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
sha2 = "0.11"
icu_normalizer = { version = "2.1.1", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.1.2", default-features = false, features = ["compiled_data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
global-hotkey = "=0.8.0"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
# Install update's download: the HTTP client WebKit already brings, with its TLS.
soup3 = "=0.5.0"
glib = "0.18"
evdev = "0.13"
inotify = "0.11"
libc = "0.2"
# The X server's held modifiers before an X11 paste; global-hotkey already builds it.
x11rb = "0.13"

[patch.crates-io]
global-hotkey = { path = "../../../vendor/global-hotkey" }
glib = { path = "../../../vendor/glib" }
tray-icon = { path = "../../../vendor/tray-icon" }
