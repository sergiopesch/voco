# A private PipeWire for the privacy check: no D-Bus and no devices, one null
# sink "fixture" and a virtual microphone, voco_fixture, that records its monitor.
context.properties = { core.daemon = true core.name = pipewire-0 support.dbus = false default.clock.rate = 48000 log.level = 2 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-access args = { } }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-client-device }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-link-factory }
  { name = libpipewire-module-loopback args = { node.description = "voco fixture mic" audio.position = [ FL FR ]
      capture.props = { node.name = fixture_loopback_capture stream.capture.sink = true target.object = fixture node.passive = true }
      playback.props = { node.name = voco_fixture media.class = Audio/Source priority.session = 2000 priority.driver = 2000 } } }
  { name = libpipewire-module-protocol-pulse args = { server.address = [ "unix:native" ] } }
]
context.objects = [
  { factory = spa-node-factory args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 20000 } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = fixture node.description = fixture media.class = Audio/Sink audio.position = [ FL FR ] monitor.channel-volumes = true } }
]
